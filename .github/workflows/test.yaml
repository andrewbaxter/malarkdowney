on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add wasm32-unknown-unknown
      # Must match the wasm-bindgen version in source/wasm/Cargo.lock
      - run: cargo install -f wasm-bindgen-cli --version 0.2.114
      - name: Unit tests
        run: cd source/wasm && cargo test
      - name: Browser tests (headless Chrome)
        run: cd source/wasm && CHROME=google-chrome tests/browser/run.sh
