[package]
name = "malarkdowney"
version = "0.2.0"
edition = "2021"
description = "An inline markdown editing widget"
readme = "../../readme.md"
repository = "https://github.com/andrewbaxter/malarkdowney"
license = "ISC"

[dependencies]
console_error_panic_hook = "0.1"
gloo = { version = "0.9", features = [
    "timers",
    "utils",
], default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CaretPosition",
    "CharacterData",
    "ClipboardEvent",
    "console",
    "CssStyleDeclaration",
    "DataTransfer",
    "DragEvent",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "FontFaceSet",
    "HtmlCollection",
    "HtmlDocument",
    "HtmlElement",
    "InputEvent",
    "KeyboardEvent",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "NodeList",
    "Range",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Selection",
    "Text",
    "Window",
] }
flowcontrol = "0.2"
rooting = "0.2"

[features]
browser_tests = []

[lib]
crate-type = ["cdylib", "rlib"]

# https://github.com/wasm-bindgen/wasm-pack/issues/1501
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lints.clippy]
all = "allow"
